apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-app-ingress
  namespace: {{.Values.frontend_tasks_app.namespace}}
  labels:
    app.kubernetes.io/name: frontend-app-ingress
  annotations:
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.priority: "100"
spec:
  rules:
    - host: tasks-app.local
      http:
        paths:
          - path: /api/v1(/.*)?
            pathType: Prefix
            backend:
              service:
                name: {{.Values.backend_tasks_app.serviceName}}
                port:
                  number: 8000
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: {{.Values.frontend_tasks_app.serviceName}}
                port:
                  number: 80

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{.Values.frontend_tasks_app.name}}
  namespace: {{.Values.frontend_tasks_app.namespace}}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{.Values.frontend_tasks_app.name}}
  template:
    metadata:
      labels:
        app: {{.Values.frontend_tasks_app.name}}
    spec:
      serviceAccountName: {{.Values.frontend_tasks_app.serviceAccountName}}
      containers:
        - name: {{.Values.frontend_tasks_app.name}}
          image: "{{.Values.frontend_tasks_app.image.repository}}:{{.Values.frontend_tasks_app.image.tag}}"
          imagePullPolicy: Always
          env:
            - name: VITE_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{.Values.frontend_tasks_app.secretName}}
                  key: VITE_BASE_URL
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: {{.Values.frontend_tasks_app.serviceName}}
  namespace: {{.Values.frontend_tasks_app.namespace}}
spec:
  type: ClusterIP
  selector:
    app: {{.Values.frontend_tasks_app.name}}
  ports:
    - port: 80
      targetPort: 8080
