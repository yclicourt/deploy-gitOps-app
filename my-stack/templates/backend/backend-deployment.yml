apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{.Values.backend_tasks_app.name}}
  namespace: {{.Values.backend_tasks_app.namespace}}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{.Values.backend_tasks_app.name}}
  template:
    metadata:
      labels:
        app: {{.Values.backend_tasks_app.name}}
    spec:
      serviceAccountName: {{.Values.backend_tasks_app.serviceAccountName}}
      securityContext:
        fsGroup: 1000
      containers:
        - name: {{.Values.backend_tasks_app.name}}
          image: "{{ .Values.backend_tasks_app.image.repository}}:{{.Values.backend_tasks_app.image.tag}}"
          imagePullPolicy: Always
          env:
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{.Values.backend_tasks_app.secretName}}
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{.Values.backend_tasks_app.secretName}}
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{.Values.backend_tasks_app.secretName}}
                  key: DB_PASSWORD
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: {{.Values.backend_tasks_app.secretName}}
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: {{.Values.backend_tasks_app.secretName}}
                  key: DB_PORT
            - name: CORS_ALLOWED_ORIGINS
              valueFrom:
                secretKeyRef:
                  name: {{.Values.backend_tasks_app.secretName}}
                  key: CORS_ALLOWED_ORIGINS
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: {{.Values.backend_tasks_app.serviceName}}
  namespace: {{.Values.backend_tasks_app.namespace}}
spec:
  type: ClusterIP
  selector:
    app: {{.Values.backend_tasks_app.name}}
  ports:
    - port: 8000
      targetPort: 8000