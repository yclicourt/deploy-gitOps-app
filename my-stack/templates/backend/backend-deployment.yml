apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-app-ingress
  namespace: {{.Values.backend_tasks_app.namespace}}
  labels:
    app.kubernetes.io/name: backend-app-ingress
  annotations:
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.entrypoints: web
    # Ayuda con problemas de timeout y buffers
    traefik.ingress.kubernetes.io/service.serversscheme: http
    traefik.ingress.kubernetes.io/router.priority: "10"
spec:
  rules:
    - host: api-tasks.local
      http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: {{.Values.backend_tasks_app.serviceName}}
                port:
                  number: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{.Values.backend_tasks_app.name}}
  namespace: {{.Values.backend_tasks_app.namespace}}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{.Values.backend_tasks_app.name}}
  template:
    metadata:
      labels:
        app: {{.Values.backend_tasks_app.name}}
    spec:
      serviceAccountName: {{.Values.backend_tasks_app.serviceAccountName}}
      initContainers:
        - name: run-migrations
          image: "{{ .Values.backend_tasks_app.image.repository}}:{{.Values.backend_tasks_app.image.tag}}"
          command: ['python', 'manage.py', 'migrate', '--noinput']
          envFrom:
            - secretRef:
                name: {{.Values.backend_tasks_app.secretName}}
      containers:
        - name: {{.Values.backend_tasks_app.name}}
          image: "{{ .Values.backend_tasks_app.image.repository}}:{{.Values.backend_tasks_app.image.tag}}"
          imagePullPolicy: Always
          env:
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{.Values.backend_tasks_app.secretName}}
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{.Values.backend_tasks_app.secretName}}
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{.Values.backend_tasks_app.secretName}}
                  key: DB_PASSWORD
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: {{.Values.backend_tasks_app.secretName}}
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: {{.Values.backend_tasks_app.secretName}}
                  key: DB_PORT
            - name: CORS_ALLOWED_ORIGINS
              valueFrom:
                secretKeyRef:
                  name: {{.Values.backend_tasks_app.secretName}}
                  key: CORS_ALLOWED_ORIGINS
            - name: ALLOWED_HOSTS
              valueFrom:
                secretKeyRef:
                  name: {{.Values.backend_tasks_app.secretName}}
                  key: ALLOWED_HOSTS
          resources:
            requests:
              memory: "256Mi"
              cpu: "500m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: {{.Values.backend_tasks_app.serviceName}}
  namespace: {{.Values.backend_tasks_app.namespace}}
spec:
  type: ClusterIP
  selector:
    app: {{.Values.backend_tasks_app.name}}
  ports:
    - port: 80
      targetPort: 8000